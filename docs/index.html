<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b271f">
<title>ParisVirtuel</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">Paris<i>Virtuel</i></div>
  <div class="right">
    <button id="bal" class="bal" aria-label="Solde virtuel"><small>Solde</small><b>0,00 €</b></button>
    <button id="menu" class="icon" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
  </div>
</header>
<div id="banner" hidden></div>
<main id="view"></main>
<button id="slipbar" hidden></button>
<div id="detail" hidden></div>
<nav>
  <button data-tab="matches" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l3.8 2.8-1.4 4.4H9.6l-1.4-4.4z"/><path d="M12 7.5V3M15.8 10.3l4.2-1.4M14.4 14.7l2.6 3.6M9.6 14.7l-2.6 3.6M8.2 10.3L4 8.9"/></svg>Matchs</button>
  <button data-tab="slip"><svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 012-2h12a2 2 0 012 2v2a2 2 0 000 4v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2a2 2 0 000-4z"/><path d="M14 6v12" stroke-dasharray="2 3"/></svg>Ticket<span id="slipN" class="badge" hidden>0</span></button>
  <button data-tab="bets"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Mes paris</button>
</nav>
<div id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
